# Blueprint de Render: define el servicio para desplegar con un clic.
# Render lee este archivo al conectar el repo (New > Blueprint) y crea el
# servicio web a partir del Dockerfile. Ver docs/deploy.md para el paso a paso.
#
# La base Postgres NO se declara acá a propósito: vive en un proveedor externo
# (Neon) y su URL se carga a mano como secreto. El Postgres free de Render expira
# a los 30 días de creado y después lo borran con los datos adentro, que es
# exactamente como se cayó la demo en agosto de 2026. Ver docs/adr/0002.

services:
  - type: web
    # El nombre define la URL pública (<name>.onrender.com). Renombrado junto al
    # repo (white-label); el KV conserva su nombre interno a propósito:
    # renombrarlo haría que el Blueprint lo recree (y se pierden las sesiones).
    name: insurance-advisor-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    # free: se duerme tras 15 min sin tráfico y tarda ~1 min en despertar. Ese
    # minuto se evita con un ping externo cada 5 min (ver docs/deploy.md): Render
    # da 750 instance-hours por workspace por mes y un servicio despierto 24/7
    # consume 744 en un mes de 31 días, así que entra sin pagar, pero SOLO si
    # este es el único free web service del workspace.
    plan: free
    healthCheckPath: /health
    autoDeploy: true # redeploya solo en cada push a la branch conectada
    envVars:
      # El canal web (la demo) no necesita Meta. Con "cli" el server arranca
      # sin pedir tokens de WhatsApp: ideal para la demo pública.
      # Para servir también el webhook de WhatsApp, cambiar a "meta" y cargar
      # las META_* de abajo (marcadas sync:false) en el dashboard de Render.
      - key: MESSAGING_PROVIDER
        value: cli
      # Persistencia en Postgres: los leads/eventos sobreviven al redeploy y al
      # spin-down (con jsonl el disco de Render es efímero y se borran).
      - key: PERSISTENCE
        value: postgres
      # La connection string de Neon se pega a mano en Environment. Es un
      # secreto (trae usuario y password), así que sync:false: no se versiona.
      # Sin ella el server falla al arrancar con un mensaje claro, no con un
      # ECONNREFUSED opaco (ver assertConfig en src/main/container.ts).
      - key: DATABASE_URL
        sync: false
      # Los managed externos exigen TLS. Las URLs de Neon ya vienen con
      # sslmode=require (que el pool detecta solo), pero se deja explícito para
      # que no dependa del formato de la URL que se pegue.
      - key: DATABASE_SSL
        value: "true"
      # Sesiones en Redis (Key Value): sobreviven al redeploy/spin-down y sirven
      # para más de una instancia (con "memory" se pierden en cada deploy).
      - key: SESSION_STORE
        value: redis
      - key: REDIS_URL
        fromService:
          type: redis
          name: lacaja-kv
          property: connectionString
      # PORT lo inyecta Render automáticamente; el server lo lee de process.env.
      # --- Secretos (solo si MESSAGING_PROVIDER=meta). Se cargan a mano en el
      # dashboard, nunca en el repo. sync:false = Render no los versiona. ---
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_RECIPIENT_OVERRIDES
        sync: false
      # Opcional: habilita las respuestas del LLM a preguntas abiertas.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Opcional: habilita el FAQ router (embeddings). Sin esta clave, las dudas
      # frecuentes las responde el LLM igual (más caro). Se carga a mano en el dashboard.
      - key: OPENAI_API_KEY
        sync: false

  # Key Value (Redis) para el store de sesiones. free: 25 MB, suficiente para la
  # demo, y no expira por fecha como sí lo hacía el Postgres free. ipAllowList
  # vacío = solo conexiones internas (el web service, misma región). Las sesiones
  # tienen TTL, así que allkeys-lru no molesta.
  # Límite del plan free: es in-memory only, o sea que si la instancia del KV se
  # reinicia se pierden las sesiones abiertas. Sobrevive a los redeploys del web
  # service (que es para lo que se puso), no a un reinicio del propio KV.
  - type: redis
    name: lacaja-kv
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
