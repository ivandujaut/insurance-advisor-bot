<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Tile de doodles gamer, seamless: cada figura vive dentro de los límites del
       tile, así al repetirse con background-repeat no hay juntas visibles. Trazos
       tenues sobre fondo oscuro, estilo WhatsApp. -->
  <rect width="300" height="300" fill="#0b141a"/>
  <g fill="none" stroke="#cdd8de" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" opacity="0.06">
    <!-- joystick / gamepad -->
    <rect x="20" y="30" width="58" height="26" rx="13"/>
    <path d="M33 43h9M37.5 38.5v9"/>
    <circle cx="62" cy="39" r="2.4"/>
    <circle cx="69" cy="46" r="2.4"/>
    <!-- estrella -->
    <path d="M150 24l4.6 9.7 10.6.9-8 7 2.5 10.4-9.7-5.6-9.7 5.6 2.5-10.4-8-7 10.6-.9z"/>
    <!-- corazon -->
    <path d="M232 34c-4.5-7-15.5-4-15.5 4 0 7 15.5 15 15.5 15s15.5-8 15.5-15c0-8-11-11-15.5-4z"/>
    <!-- dado -->
    <rect x="256" y="60" width="30" height="30" rx="6"/>
    <circle cx="263" cy="67" r="1.6" fill="#cdd8de" stroke="none"/>
    <circle cx="279" cy="67" r="1.6" fill="#cdd8de" stroke="none"/>
    <circle cx="271" cy="75" r="1.6" fill="#cdd8de" stroke="none"/>
    <circle cx="263" cy="83" r="1.6" fill="#cdd8de" stroke="none"/>
    <circle cx="279" cy="83" r="1.6" fill="#cdd8de" stroke="none"/>
    <!-- space invader -->
    <path d="M28 96h6v-6h6v6h18v-6h6v6h6v10h-6v6h6v10h-6v-6h-6v6h-24v-6h-6v6h-6v-10h6v-6h-6z"/>
    <!-- joystick arcade -->
    <path d="M120 132c0 6 20 6 20 0"/>
    <path d="M130 132v-22"/>
    <circle cx="130" cy="104" r="7"/>
    <!-- auriculares -->
    <path d="M188 122a17 17 0 0 1 34 0"/>
    <rect x="184" y="120" width="10" height="16" rx="3"/>
    <rect x="216" y="120" width="10" height="16" rx="3"/>
    <!-- rayo -->
    <path d="M270 108l-11 18h8l-9 18 20-23h-9z"/>
    <!-- engranaje -->
    <circle cx="52" cy="180" r="11"/>
    <path d="M52 163v-6M52 203v-6M35 180h-6M75 180h-6M40 168l-4-4M68 196l-4-4M64 168l4-4M40 192l-4 4"/>
    <!-- consola portatil -->
    <rect x="118" y="162" width="40" height="42" rx="7"/>
    <rect x="126" y="170" width="24" height="16" rx="2"/>
    <path d="M126 194h6M129 191v6"/>
    <circle cx="148" cy="194" r="2.2"/>
    <!-- gema / diamante -->
    <path d="M212 168l14 4-14 20-14-20z"/>
    <path d="M198 172h28"/>
    <!-- pac-man -->
    <path d="M285 186a13 13 0 1 0 0 22l-13-11z"/>
    <!-- d-pad -->
    <path d="M40 244h8v-8h10v8h8v10h-8v8h-10v-8h-8z"/>
    <!-- trofeo -->
    <path d="M112 236h20v6a10 10 0 0 1-20 0z"/>
    <path d="M112 240c-6 0-8-4-8-8h6M132 240c6 0 8-4 8-8h-6"/>
    <path d="M118 252v6h8v-6M114 262h16"/>
    <!-- nota musical -->
    <path d="M188 258v-22l14-4v22"/>
    <circle cx="184" cy="260" r="4.5"/>
    <circle cx="198" cy="256" r="4.5"/>
    <!-- boton de power -->
    <circle cx="256" cy="252" r="12"/>
    <path d="M256 244v9"/>
    <path d="M250 247a9 9 0 1 0 12 0"/>
    <!-- ta-te-ti -->
    <path d="M22 250h34M22 262h34M32 244v34M46 244v34"/>
    <!-- acentos: puntos, cruces, triangulos -->
    <circle cx="96" cy="60" r="2" fill="#cdd8de" stroke="none"/>
    <circle cx="176" cy="96" r="2" fill="#cdd8de" stroke="none"/>
    <circle cx="250" cy="150" r="2" fill="#cdd8de" stroke="none"/>
    <circle cx="90" cy="150" r="2" fill="#cdd8de" stroke="none"/>
    <circle cx="160" cy="230" r="2" fill="#cdd8de" stroke="none"/>
    <circle cx="228" cy="228" r="2" fill="#cdd8de" stroke="none"/>
    <path d="M204 60l6 6M210 60l-6 6"/>
    <path d="M96 218l6 6M102 218l-6 6"/>
    <path d="M280 118l6 6M286 118l-6 6"/>
    <path d="M150 130l5 8h-10z"/>
    <path d="M66 118l5 8h-10z"/>
  </g>
</svg>
