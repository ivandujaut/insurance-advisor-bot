name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lacaja
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lacaja"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Check architecture
        run: pnpm check:arch

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/lacaja
          REDIS_URL: redis://localhost:6379

  # Smoke test del empaquetado: buildea la imagen Docker completa (builder +
  # runtime). El `pnpm build` local no alcanza para detectar fallas del contexto
  # de Docker (ej: docs/ excluido por .dockerignore rompía copy-assets, o COPY docs
  # fallaba); esto las atrapa antes del deploy. No publica la imagen, solo valida
  # que compile.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
